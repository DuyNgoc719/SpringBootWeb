<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/user.css}">
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <!-- Profile Card -->
            <div class="col-md-3">
                <div class="card text-center">
                    <div class="d-flex align-items-center">
                        <div class="profile-img">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="ms-3">
                            <div class="profile-name">NGUYỄN DUY NGỌC</div>
                            <div class="profile-phone">0338270892</div>
                        </div>
                        <div class="ms-auto">
                            <a class="profile-link" href="#">Xem hồ sơ</a>
                        </div>
                    </div>
                    <div class="card-body mt-3">
                        <p>Quý khách chưa là thành viên tại ALOTRA</p>
                        <p>Quan tâm Zalo ALOTRA để kích hoạt điểm thưởng</p>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <button class="btn">Quan tâm ngay</button>
                            <a class="link" href="#">Xem thể lệ &gt;</a>
                        </div>
                    </div>
                </div>
                <div class="sidebar mt-4">
                    <a class="nav-link" href="#"><i class="fas fa-box"></i>Đơn hàng của tôi</a>
                    <a class="nav-link" href="#"><i class="fas fa-heart"></i>Khách hàng thân thiết</a>
                    <a class="nav-link" href="#"><i class="fas fa-map-marker-alt"></i>Số địa chỉ nhận hàng</a>
                    <a class="nav-link" href="#"><i class="fas fa-sign-out-alt"></i>Đăng xuất</a>
                </div>
            </div>

            <!-- Content Section -->
            <div class="col-md-9">
                <div class="content">
                    <h5>Thông tin cá nhân</h5>
                    <div class="text-center">
                        <img src="https://storage.googleapis.com/a1aa/image/PcwSFkWspiaMGtK6ww4gIH0RS847Bjjt3hkGRYW45i3hS55E.jpg" class="img-fluid" alt="User profile picture" width="100" height="100"/>
                    </div>
                    <div class="mt-3">
                        <div class="row mb-3">
                            <div class="col-md-3 text-end"><p>Họ và tên</p></div>
                            <div class="col-md-9"><p>NGUYỄN DUY NGỌC</p></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-3 text-end"><p>Số điện thoại</p></div>
                            <div class="col-md-9"><p>0338270892</p></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-3 text-end"><p>Giới tính</p></div>
                            <div class="col-md-9"><p>Nam</p></div>
                        </div>
                        <div class="text-center">
                            <button class="btn">Chỉnh sửa thông tin</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
